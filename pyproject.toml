[project]
name = "study-planner"
version = "0.1.0"
description = "SSE Project: ICL DoC Study Planner API"
authors = [
    { name = "Cindra", email = "cindra.cindra4625@imperial.ac.uk" },
]
readme = "README.md"
requires-python = ">=3.13, <4.0"

dependencies = [
    "alembic>=1.13.3,<2.0.0",
    "fastapi[standard]>=0.128.0,<0.129.0",
    "psycopg2>=2.9.10,<3.0.0",
    "sqlmodel>=0.0.22,<0.1.0",
    "requests>=2.32.3,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "types-requests>=2.32.0.20241016,<3.0.0",
    "sqlalchemy-utils>=0.41.2,<0.42.0",
    "typer[all]>=0.21.1,<0.22.0",
    "python-ldap>=3.4.4,<4.0.0",
    "python-multipart>=0.0.16,<0.1.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "types-python-dateutil>=2.9.0.20241003,<3.0.0",
    "fastapi-cache2[redis]>=0.2.2,<0.3.0",
    "aioredis>=2.0.1,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "datamodel-code-generator (>=0.53.0,<0.54.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.0,<9.1.0"
pytest-factoryboy = ">=2.7.0,<3.0.0"
pytest-cov = ">=7.0.0,<7.1.0"
freezegun = ">=1.5.1,<2.0.0"
ruff = ">=0.15.0,<0.16.0"
black = ">=25.12.0,<25.13.0"
ty = "^0.0.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
exclude = "venv"
disable_error_code = "var-annotated"
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["F821", "F403", "E731"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (real external API calls)",
]
