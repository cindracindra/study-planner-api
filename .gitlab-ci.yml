image: python:3.12

stages:
  - prepare
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"

cache:
  key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
  paths:
    - $PIP_CACHE_DIR
    - $POETRY_CACHE_DIR

before_script:
  - apt-get update -qq
  - apt-get install -y python3.13-dev build-essential libldap2-dev libsasl2-dev ldap-utils libpq-dev enscript poppler-utils qpdf
  - pip install poetry
  - poetry config cache-dir $POETRY_CACHE_DIR

cache dependencies:
  stage: prepare
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - ".gitlab-ci.yml"
        - "*.py"
        - "app/**/*"
        - "migrations/**/*"
        - "tests/**/*"
        - "pyproject.toml"
        - "poetry.lock"
  script:
    - poetry install --no-interaction --no-root
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - $PIP_CACHE_DIR
      - $POETRY_CACHE_DIR
    policy: push
  tags:
    - edtech

check style:
  stage: lint
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - "*.py"
        - "app/**/*"
        - "migrations/**/*"
        - "tests/**/*"
        - "pyproject.toml"
        - "poetry.lock"
  script:
    - poetry run ruff check .
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - $PIP_CACHE_DIR
      - $POETRY_CACHE_DIR
    policy: pull
  tags:
    - edtech

check types:
  stage: lint
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - "*.py"
        - "app/**/*"
        - "migrations/**/*"
        - "tests/**/*"
        - "pyproject.toml"
        - "poetry.lock"
  script:
    - poetry run ty check .
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - $PIP_CACHE_DIR
      - $POETRY_CACHE_DIR
    policy: pull
  tags:
    - edtech


test:
  stage: test
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - ".gitlab-ci.yml"
        - "*.py"
        - "app/**/*"
        - "migrations/**/*"
        - "pyproject.toml"
        - "poetry.lock"
        - "tests/**/*"
  services:
    - name: postgres:16
      alias: db-service
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_USER: "test_user"
    POSTGRES_DB: "test_study_planner"
    POSTGRES_HOST_AUTH_METHOD: "trust"
    TEST_DB_SERVER_URL: "postgresql://test_user@db-service"
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - $PIP_CACHE_DIR
      - $POETRY_CACHE_DIR
    policy: pull
  script:
    - apt-get update && apt-get install -y postgresql-client
    - until pg_isready -h db-service -U test_user; do echo "Waiting for postgres...";
    - poetry run pytest --junitxml=report.xml --cov=app/ tests/
    - poetry run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  tags:
    - edtech


run migrations consistency test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - "migrations/**/*"
  services:
    - name: postgres:16
      alias: db-service
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    POSTGRES_USER: "user"
    POSTGRES_PASSWORD: "pass"
    POSTGRES_DB: "migrations-tests"
    DATABASE_URL: "postgresql://user:pass@db-service/migrations-tests"
  script:
    - if poetry run alembic current 2>/dev/null | grep -q '[0-9a-f]'; then
    -   echo "❌ Target DB is not fresh, aborting migrations test."
    -   exit 1
    - fi
    - poetry run alembic upgrade head
    - poetry run alembic downgrade base
    - poetry run alembic upgrade head
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - $PIP_CACHE_DIR
      - $POETRY_CACHE_DIR
    policy: pull
  tags:
    - edtech
