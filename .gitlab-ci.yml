image: python:3.12

stages:
  - prepare
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"

cache:
  key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
  paths:
    - $PIP_CACHE_DIR
    - $POETRY_CACHE_DIR

before_script:
  - apt-get update -qq
  - apt-get install -y python3.13-dev build-essential libldap2-dev libsasl2-dev ldap-utils libpq-dev enscript poppler-utils qpdf
  - pip install poetry
  - poetry config cache-dir $POETRY_CACHE_DIR

cache dependencies:
  stage: prepare
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - ".gitlab-ci.yml"
        - "*.py"
        - "app/**/*"
        - "migrations/**/*"
        - "tests/**/*"
        - "pyproject.toml"
        - "poetry.lock"
  script:
    - poetry install --no-interaction --no-root
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - $PIP_CACHE_DIR
      - $POETRY_CACHE_DIR
    policy: push
  tags:
    - edtech

check style:
  stage: lint
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - "*.py"
        - "app/**/*"
        - "migrations/**/*"
        - "tests/**/*"
        - "pyproject.toml"
        - "poetry.lock"
  script:
    - poetry run ruff check .
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - $PIP_CACHE_DIR
      - $POETRY_CACHE_DIR
    policy: pull
  tags:
    - edtech

check types:
  stage: lint
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
      changes:
        - "*.py"
        - "app/**/*"
        - "migrations/**/*"
        - "tests/**/*"
        - "pyproject.toml"
        - "poetry.lock"
  script:
    - poetry run ty check .
  cache:
    key: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
    paths:
      - $PIP_CACHE_DIR
      - $POETRY_CACHE_DIR
    policy: pull
  tags:
    - edtech